[project]
name = "cmu-poker-ai-agent"
version = "0.1.0"
description = "Poker AI competition engine and agents for a custom heads-up poker variant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.1",
    "gym==0.26.2",
    "numpy==1.26.4",
    "requests==2.32.5",
    "treys==0.1.8",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
rl = [
    "torch==2.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    ".",
]
python_files = [
    "*_test.py",
    "test_*.py",
]
